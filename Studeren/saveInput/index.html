<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
  <link rel="stylesheet" href="styles/css.css">
</head>
<body>
<h1>Give input</h1>
<p id="counter">0</p>

<div id="inputContainer">

<label for="input">Give the Name: </label>
<input type="text" id="input">
  <br>
  <label for="inhoud">Give the "inhoud":  </label>
  <input type="text" id="inhoud">
  <br>
  <label for="colors">Select your Color: </label>
  <select id="colors">

    <option value="red">Red</option>
    <option value="green">Green</option>
    <option value="blue">Blue</option>

  </select>

  <br>
  <label for="submitButton">Submit</label>
  <input type="button" value="Submit" id="submitButton">
  <label for="toggleButton">Toggle Colors</label>
  <input type="button" id="toggleButton">

</div>

<div id="outputDiv">


</div>

<script src="scripts/js.js"></script>
</body>
</html>
